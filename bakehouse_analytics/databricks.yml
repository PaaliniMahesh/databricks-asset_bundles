    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-e7f1f762-cd5c.cloud.databricks.com
    variables:
      catalog: bake_house_analytics_dev
      schema: rnd
  prod:
    mode: production
    workspace:
      host: https://dbc-e7f1f762-cd5c.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/maheshp41904@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/maheshp41904@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bake_house_analytics_dev
      schema: prod
    permissions:
      - user_name: maheshp41904@gmail.com
        level: CAN_MANAGE
